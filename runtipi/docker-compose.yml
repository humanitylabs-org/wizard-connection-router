# Pinned official runtime; App Manager mounts the pinned source read-only.
x-runtipi:
  schema_version: 2
  overrides: []
services:
  wizard-connection-router:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    # App Manager's fresh /data bind is root-owned; capabilities remain dropped.
    user: "0:0"
    working_dir: /app
    command: ["python3", "server.py"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: /app/vendor
      WIZARD_APPS_JSON: /run/wizard/apps.json
      WIZARD_RECIPES_DIR: /run/recipes
      WIZARD_GRANTS_FILE: /run/grants/grants.json
      WIZARD_ROUTER_DATA_DIR: /data
      WIZARD_ROUTER_PORT: "8802"
    volumes:
      - ${APP_SOURCE_DIR}:/app:ro
      - ${APP_DATA_DIR}/data:/data
      - ${ROOT_FOLDER_HOST}/app-data/wizard-os:/run/wizard:ro
      - ${ROOT_FOLDER_HOST}/repos:/run/recipes:ro
      - ${APP_DATA_DIR}/wizard:/run/grants:ro
    ports:
      - "127.0.0.1:${APP_PORT}:8802"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8802/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    x-runtipi:
      is_main: true
      internal_port: 8802
      add_to_main_network: true
