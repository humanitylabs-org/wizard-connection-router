# Immutable release; App Manager shares its credential-free installed registry.
x-runtipi:
  schema_version: 2
  overrides: []
services:
  wizard-connection-router:
    image: ghcr.io/humanitylabs-org/wizard-connection-router:0.1.4@sha256:71e9721efc3904c76862b83613d6e88a1c5edff26432152f3727073fde417ecf
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 128m
    environment:
      WIZARD_APPS_JSON: /run/wizard/apps.json
      WIZARD_RECIPES_DIR: /run/recipes
      WIZARD_GRANTS_FILE: /run/grants/grants.json
      WIZARD_ROUTER_DATA_DIR: /data
      WIZARD_ROUTER_PORT: "8802"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${ROOT_FOLDER_HOST}/app-data/wizard-os:/run/wizard:ro
      - ${ROOT_FOLDER_HOST}/repos:/run/recipes:ro
      - ${APP_DATA_DIR}/wizard:/run/grants:ro
    ports:
      - "127.0.0.1:${APP_PORT}:8802"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8802/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    x-runtipi:
      is_main: true
      internal_port: 8802
      add_to_main_network: true
